name: Morning brief

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * 1-5"

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: PYTHONPATH=. python scripts/generate_morning_brief.py

      - name: Commit brief history
        run: |
          git config user.name "macro-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: morning brief"
          git push
