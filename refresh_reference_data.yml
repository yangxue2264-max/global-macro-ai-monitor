name: Refresh free A-share reference data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0" # Sunday 20:00 Asia/Shanghai; exact time is not critical

concurrency:
  group: a-share-reference-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/refresh_a_share_universe.py
      - name: Commit validated reference data
        run: |
          git config user.name "a-share-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reference/
          git diff --cached --quiet || git commit -m "chore: refresh A-share reference data"
          git push
