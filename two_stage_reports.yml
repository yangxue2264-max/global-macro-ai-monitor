name: A-share personalized email reports

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Report stage
        required: true
        type: choice
        options:
          - morning
          - auction
      send_emails:
        description: Send real subscriber emails
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "45 0 * * 1-5" # 08:45 Asia/Shanghai
    - cron: "27 1 * * 1-5" # 09:27 Asia/Shanghai

concurrency:
  group: a-share-report-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      APP_URL: ${{ secrets.APP_URL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: route
        name: Select report stage
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            stage="${{ inputs.stage }}"
            send="${{ inputs.send_emails }}"
          elif [[ "${{ github.event.schedule }}" == "45 0 * * 1-5" ]]; then
            stage="morning"
            send="true"
          else
            stage="auction"
            send="true"
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "send=$send" >> "$GITHUB_OUTPUT"

      - name: Generate personalized report
        shell: bash
        run: |
          args=()
          if [[ "${{ steps.route.outputs.send }}" == "true" ]]; then args+=(--send-emails); fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then args+=(--force); fi
          if [[ "${{ steps.route.outputs.stage }}" == "morning" ]]; then
            PYTHONPATH=. python scripts/generate_morning_brief.py "${args[@]}"
          else
            PYTHONPATH=. python scripts/generate_auction_snapshot.py "${args[@]}"
          fi

      - name: Commit report snapshots
        run: |
          git config user.name "a-share-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: ${{ steps.route.outputs.stage }} report"
          git push
