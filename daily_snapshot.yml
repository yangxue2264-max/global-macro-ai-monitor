name: Daily 09:00 A-share pre-open snapshot

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:00 UTC = 09:00 Asia/Shanghai.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/generate_morning_brief.py
      - name: Commit snapshot when changed
        run: |
          git config user.name "macro-monitor-bot"
          git config user.email "macro-monitor-bot@users.noreply.github.com"
          git add data/brief_history data/latest_morning_brief.json
          git diff --cached --quiet || git commit -m "data: daily pre-open snapshot"
          git push
